<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Твинкл</title><link rel="stylesheet" href="style.css"><script type="module" src="popup.js"></script></head>
<body class="popup"><div class="brand"><img src="icons/48.png" width="40" height="40" alt=""><span>Твинкл<small>Голосование за серверы</small></span></div>
<p class="popup-intro">Выберите проект</p>
<button id="main" class="project-card project-main" aria-label="Проголосовать за основной проект"><span class="project-label">TWINKLE PLAY</span><strong>Основной проект</strong><span id="mainCount" class="project-count"></span><span class="project-cta">Проголосовать <span aria-hidden="true">→</span></span></button>
<button id="stalker" class="project-card project-stalker" aria-label="Проголосовать за Сталкер"><span class="project-label">TWINKLE PLAY</span><strong>Сталкер</strong><span id="stalkerCount" class="project-count"></span><span class="project-cta">Проголосовать <span aria-hidden="true">→</span></span></button><p class="popup-help">Один ваш клик на каждом сервере.<br>Переход к следующему Твинкл сделает сам.</p>
<p id="status" role="status" class="note"></p>
<div class="actions"><button id="resume" class="secondary" hidden>Продолжить</button><button id="stop" class="text-button" hidden>Остановить</button></div>
<button id="settings" class="text-button full">Все серверы и настройки</button></body></html>
